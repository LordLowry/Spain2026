<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d2b">
<title>Golf Group Kitty</title>
<style>
:root{
  --green:#1f3d2b; --green-2:#2c5a3f; --bg:#f1f5ef; --card:#ffffff;
  --ink:#14231a; --muted:#5d6e63; --line:#d9e2d5; --flag:#c8402b; --gold:#e8d48b;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1913; --card:#18271e; --ink:#eaf1e8; --muted:#93a698; --line:#2b3d31; --green:#163021; --green-2:#2c5a3f;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.hero{
  background:var(--green); color:#fff; text-align:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 20px 36px;
  border-radius:0 0 28px 28px;
}
.hero p{margin:0;color:var(--gold);font-size:1rem}
.total{
  font-family:Georgia,"Times New Roman",serif; font-weight:700;
  font-size:clamp(3.5rem,20vw,7rem); line-height:1.05; margin:6px 0 0;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; word-break:break-all;
}
.total.neg{color:#ffb4a6}
.status{font-size:.8rem;color:#b9cdbd;margin-top:8px;min-height:1.2em}
.status.err{color:#ffb4a6}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
h2{font-size:1.1rem;margin:0 0 12px}
form{display:grid;grid-template-columns:1fr 7.5rem;gap:10px;margin-bottom:10px}
input{
  font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;width:100%;min-height:50px;
}
input:focus{outline:3px solid var(--green-2);outline-offset:1px;border-color:var(--green-2)}
button{font:inherit;cursor:pointer;min-height:50px;border:0;border-radius:12px}
.add{grid-column:1/-1;background:var(--green-2);color:#fff;font-weight:600}
.add:active{transform:scale(.985)}
.add:disabled{opacity:.6}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 22px}
ul{list-style:none;margin:0;padding:0}
li{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 8px 12px 14px;margin-bottom:8px;
}
.desc{flex:1;min-width:0;overflow-wrap:anywhere}
.date{display:block;color:var(--muted);font-size:.8rem}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--flag)}
.del{background:none;color:var(--muted);width:44px;min-height:44px;font-size:1.3rem}
.del:hover{color:var(--flag)}
.empty{color:var(--muted);text-align:center;padding:24px 0;display:block}
.setup{background:var(--card);border:1.5px solid var(--flag);border-radius:12px;padding:14px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<header class="hero">
  <p>Kitty</p>
  <div class="total" id="total" aria-live="polite">€0.00</div>
  <div class="status" id="status"></div>
</header>

<main>
  <div class="setup" id="setup">Database not connected yet. Paste your Firebase database URL into <b>DB_URL</b> at the top of the script in index.html.</div>

  <h2>Add to the kitty</h2>
  <form id="form">
    <input id="desc" placeholder="Description, e.g. Dinner 12 Oct" autocomplete="off" maxlength="80" required>
    <input id="amt" type="text" inputmode="decimal" placeholder="€ 0.00" autocomplete="off" required aria-label="Amount in euro">
    <button class="add" id="addBtn" type="submit">Add line</button>
  </form>
  <p class="hint">Use a minus, e.g. -20, when money is taken out of the kitty.</p>

  <ul id="list"></ul>
</main>

<script>
(function(){
  // Paste your Firebase Realtime Database URL between the quotes, no trailing slash.
  // Example: "https://golf-kitty-default-rtdb.europe-west1.firebasedatabase.app"
  var DB_URL = "";

  var items=[];
  var list=document.getElementById("list"), totalEl=document.getElementById("total");
  var statusEl=document.getElementById("status"), addBtn=document.getElementById("addBtn");
  var fmt=new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR"});

  if(!DB_URL) document.getElementById("setup").style.display="block";

  function setStatus(msg,err){ statusEl.textContent=msg; statusEl.className="status"+(err?" err":""); }

  function render(){
    var cents=items.reduce(function(s,i){return s+i.c;},0);
    totalEl.textContent=fmt.format(cents/100);
    totalEl.className="total"+(cents<0?" neg":"");
    list.innerHTML="";
    if(!items.length){
      var e=document.createElement("li"); e.className="empty";
      e.textContent="Nothing here yet. Add the first line above.";
      list.appendChild(e); return;
    }
    items.forEach(function(it){
      var li=document.createElement("li");
      var d=document.createElement("div"); d.className="desc";
      d.textContent=it.d;
      var dt=document.createElement("span"); dt.className="date";
      dt.textContent=new Date(it.t).toLocaleDateString("en-IE",{day:"numeric",month:"short",year:"numeric"});
      d.appendChild(dt);
      var a=document.createElement("div"); a.className="amt"+(it.c<0?" neg":"");
      a.textContent=fmt.format(it.c/100);
      var x=document.createElement("button"); x.className="del"; x.type="button";
      x.textContent="×"; x.setAttribute("aria-label","Delete "+it.d);
      x.onclick=function(){ remove(it); };
      li.append(d,a,x); list.appendChild(li);
    });
  }

  function load(){
    if(!DB_URL) return Promise.resolve();
    return fetch(DB_URL+"/entries.json",{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        items=Object.keys(data||{}).map(function(k){ var o=data[k]; o.id=k; return o; })
          .sort(function(a,b){return b.t-a.t;});
        render(); setStatus("Up to date");
      })
      .catch(function(){ setStatus("Can't reach the database. Check your connection.",true); });
  }

  function remove(it){
    if(!confirm("Delete \""+it.d+"\"?")) return;
    fetch(DB_URL+"/entries/"+it.id+".json",{method:"DELETE"})
      .then(function(r){ if(!r.ok) throw new Error(); return load(); })
      .catch(function(){ setStatus("Couldn't delete. Try again.",true); });
  }

  document.getElementById("form").addEventListener("submit",function(ev){
    ev.preventDefault();
    if(!DB_URL){ setStatus("Database not connected yet.",true); return; }
    var desc=document.getElementById("desc"), amt=document.getElementById("amt");
    var n=parseFloat(amt.value.replace(/[€\s]/g,"").replace(",","."));
    if(!desc.value.trim()||isNaN(n)){ amt.focus(); return; }
    var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var entry={d:desc.value.trim(),c:Math.round(n*100),t:Date.now()};
    addBtn.disabled=true; setStatus("Saving…");
    fetch(DB_URL+"/entries/"+id+".json",{method:"PUT",body:JSON.stringify(entry)})
      .then(function(r){ if(!r.ok) throw new Error(); desc.value=""; amt.value=""; desc.focus(); return load(); })
      .catch(function(){ setStatus("Couldn't save. Try again.",true); })
      .then(function(){ addBtn.disabled=false; });
  });

  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
  setInterval(function(){ if(!document.hidden) load(); },15000);
  render(); load();
})();
</script>
</body>
</html>
